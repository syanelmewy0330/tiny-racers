# Render.com setup: one free web service that runs the race server and serves the game.
services:
  - type: web
    name: tiny-racers
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
